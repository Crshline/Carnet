<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Carnet — films, séries, livres</title>

<!-- PWA : permet d'installer le site comme une appli sur le téléphone. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d50">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Carnet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- La librairie officielle Supabase, chargée depuis un CDN.
     Elle expose une variable globale "supabase" qu'on utilise plus bas. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg:        #e9ebe4;
    --surface:   #ffffff;
    --ink:       #22271f;
    --muted:     #6b7168;
    --line:      #d5d8ce;
    --accent:    #2f5d50;
    --star:      #d9a441;
    --film:      #b0413a;
    --serie:     #4a6fa5;
    --livre:     #4f7a4a;
    --radius:    12px;
    --shadow:    0 1px 2px rgba(34,39,31,.06), 0 8px 24px rgba(34,39,31,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

  header h1 {
    font-family: "Fraunces", serif; font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.02em; margin: 0;
  }
  header p { color: var(--muted); margin: 4px 0 0; font-size: 1.05rem; }

  .stats {
    display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    margin: 28px 0 36px; padding: 22px 26px;
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .stats-hero { display: flex; flex-direction: column; }
  .stats-hero .num-big {
    font-family: "Fraunces", serif; font-size: 2.7rem; font-weight: 600; line-height: 1;
  }
  .stats-hero .lbl {
    color: var(--muted); font-size: .8rem; text-transform: uppercase;
    letter-spacing: .06em; margin-top: 5px;
  }
  .stats-sep { align-self: stretch; width: 1px; background: var(--line); }
  .stats-types { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 220px; }
  .type-row { display: flex; gap: 22px; flex-wrap: wrap; }
  .type-stat { display: flex; align-items: baseline; gap: 7px; font-size: .92rem; color: var(--muted); }
  .type-stat b {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 1.2rem; color: var(--ink);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
  .dot.film { background: var(--film); }
  .dot.serie { background: var(--serie); }
  .dot.livre { background: var(--livre); }
  .dist { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--bg); }
  .dist span { display: block; height: 100%; }

  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .layout .panel { position: static; }   /* sélecteur plus spécifique → gagne sur le sticky */
  }

  .panel {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; position: sticky; top: 24px;
  }
  .panel h2 { font-family: "Fraunces", serif; font-weight: 600; margin: 0 0 20px; font-size: 1.3rem; }
  label {
    display: block; font-size: .82rem; font-weight: 500; color: var(--muted);
    margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  input[type="text"], input[type="date"], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; color: var(--ink); background: #fbfbf9;
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }
  textarea { resize: vertical; min-height: 70px; }

  /* Étoiles à remplissage : une étoile grise de fond, une dorée par-dessus
     dont on règle la largeur (0, 50 ou 100 %) pour obtenir des demi-étoiles. */
  .st {
    position: relative; display: inline-block; width: 1em; height: 1em;
    line-height: 1; color: var(--line);
  }
  .st::before { content: "★"; position: absolute; left: 0; top: 0; }
  .st .fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0; overflow: hidden;
    color: var(--star);
  }
  .st .fill::before { content: "★"; position: absolute; left: 0; top: 0; }
  .st .half { position: absolute; top: 0; height: 100%; width: 50%; z-index: 2; }
  .st .half.left  { left: 0; }
  .st .half.right { right: 0; }
  .stars-input { display: inline-flex; gap: 3px; margin-top: 6px; font-size: 1.7rem; }
  .stars-input .st { cursor: pointer; }
  .rating { display: inline-flex; gap: 3px; }

  .btn {
    width: 100%; margin-top: 22px; padding: 12px; background: var(--accent);
    color: #fff; border: none; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }

  .search-box { position: relative; }
  .results {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); max-height: 320px; overflow-y: auto;
  }
  .results:empty { display: none; }
  .result {
    display: flex; gap: 10px; padding: 8px 10px; cursor: pointer; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .result:last-child { border-bottom: none; }
  .result:hover { background: #f2f4ee; }
  .result img { width: 34px; height: 50px; object-fit: cover; border-radius: 3px; background: var(--line); flex: none; }
  .result .r-title { font-weight: 600; font-size: .92rem; }
  .result .r-sub { color: var(--muted); font-size: .8rem; }
  .results .hint { padding: 12px; color: var(--muted); font-size: .85rem; }

  .chosen {
    display: none; gap: 10px; align-items: center; margin-top: 10px;
    padding: 8px; background: #f2f4ee; border-radius: 8px;
  }
  .chosen img { width: 38px; height: 56px; object-fit: cover; border-radius: 4px; background: var(--line); flex: none; }
  .chosen .c-title { font-weight: 600; font-size: .92rem; line-height: 1.2; }
  .chosen .c-sub { color: var(--muted); font-size: .8rem; }
  .chosen .c-clear {
    margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1rem;
  }

  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .controls .ctrl, .controls .ctrl-search {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: var(--surface); color: var(--ink);
  }
  .controls .ctrl-search { flex: 1; min-width: 180px; }
  .controls .ctrl:focus, .controls .ctrl-search:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }

  /* Onglets Journal / Statistiques + bouton Exporter */
  .tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 18px; }
  .tab {
    background: none; border: none; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--muted); padding: 8px 4px; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-actions { margin-left: auto; display: flex; gap: 6px; }
  .tab-btn {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: .85rem;
    cursor: pointer; color: var(--ink);
  }
  .tab-btn:hover { border-color: var(--accent); }

  /* Page de statistiques */
  .stats-page { display: grid; gap: 20px; }
  .stat-card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .stat-card h3 { font-family: "Fraunces", serif; font-weight: 600; margin: 0 0 14px; font-size: 1.1rem; }
  .big-stat { font-family: "Fraunces", serif; font-size: 2.4rem; font-weight: 600; line-height: 1; }
  .muted-note { color: var(--muted); font-size: .85rem; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: .9rem; }
  .bar-row .bar-label { width: 64px; color: var(--muted); flex: none; }
  .bar-row .bar-track { flex: 1; height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar-row .bar-fill { display: block; height: 100%; background: var(--accent); }
  .bar-row .bar-val { width: 26px; text-align: right; color: var(--muted); flex: none; }
  .top-list { display: flex; flex-direction: column; gap: 10px; }
  .top-item { display: flex; align-items: center; gap: 10px; font-size: .95rem; }

  /* Rétrospective annuelle ("Wrapped") */
  .wrapped {
    background: var(--accent); color: #f5f4f0; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px;
  }
  .wrapped-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .wrapped-head h3 { font-family: "Fraunces", serif; margin: 0; font-size: 1.15rem; color: #f5f4f0; }
  .wrapped-year {
    background: rgba(255,255,255,.14); color: #f5f4f0; border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: .85rem;
  }
  .wrapped-year option { color: #22271f; }
  .wrapped-big { font-family: "Fraunces", serif; font-size: 3.4rem; font-weight: 600; line-height: 1; margin-top: 8px; color: var(--star); }
  .wrapped-sub { font-size: .9rem; opacity: .9; margin-bottom: 16px; }
  .wrapped-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 18px; font-size: .95rem; }
  .wrapped-row b { font-family: "Fraunces", serif; font-size: 1.2rem; }
  .wrapped-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .wrapped-grid .w-num { font-family: "Fraunces", serif; font-size: 1.7rem; font-weight: 600; line-height: 1.15; }
  .wrapped-grid .w-lab, .wrapped-coup-wrap .w-lab {
    font-size: .72rem; opacity: .85; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px;
  }
  .wrapped-coup-wrap { margin-top: 18px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 14px; }
  .wrapped-coup { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 1rem; }
  .wrapped-empty { opacity: .9; margin: 10px 0 0; }

  /* Calendrier d'activité (façon contributions GitHub) */
  .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
  .hm-labels { display: flex; gap: 3px; margin-bottom: 4px; }
  .hm-lab { width: 11px; flex: none; font-size: .62rem; color: var(--muted); white-space: nowrap; }
  .hm-grid { display: flex; gap: 3px; }
  .hm-col { display: flex; flex-direction: column; gap: 3px; }
  .hm-cell { width: 11px; height: 11px; border-radius: 2px; flex: none; display: inline-block; }
  .hm-0 { background: var(--line); }
  .hm-1 { background: #cfe0d6; }
  .hm-2 { background: #9cc3ad; }
  .hm-3 { background: #5f9e7e; }
  .hm-4 { background: #2f5d50; }
  .hm-empty { background: transparent; }
  .hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; font-size: .78rem; color: var(--muted); }

  .month-sep {
    font-family: "Fraunces", serif; font-size: 1.1rem; color: var(--muted);
    margin: 28px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    text-transform: capitalize;
  }
  .month-sep:first-child { margin-top: 0; }

  .entry {
    display: flex; gap: 16px; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px; position: relative;
    border-left: 5px solid var(--line);      /* bandeau coloré selon le type */
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .entry:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(34,39,31,.07), 0 14px 32px rgba(34,39,31,.10);
  }
  .entry.film  { border-left-color: var(--film); }
  .entry.serie { border-left-color: var(--serie); }
  .entry.livre { border-left-color: var(--livre); }
  .entry .poster {
    width: 62px; height: 92px; object-fit: cover; border-radius: 6px;
    background: var(--line); flex: none; box-shadow: 0 2px 6px rgba(34,39,31,.15);
  }
  /* Affiche de remplacement quand la couverture manque : initiale sur fond coloré. */
  .entry .poster.ph {
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", serif; font-size: 1.9rem; font-weight: 600; color: #fff;
  }
  .entry .poster.ph-film  { background: var(--film); }
  .entry .poster.ph-serie { background: var(--serie); }
  .entry .poster.ph-livre { background: var(--livre); }
  .entry-body { flex: 1; min-width: 0; padding-right: 44px; }
  .entry-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry h3 { font-family: "Fraunces", serif; font-weight: 600; margin: 0; font-size: 1.25rem; }
  .tag {
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: #fff; padding: 3px 9px; border-radius: 20px;
  }
  .tag.film  { background: var(--film); }
  .tag.serie { background: var(--serie); }
  .tag.livre { background: var(--livre); }
  .entry .saison { font-size: .82rem; color: var(--muted); font-weight: 500; }
  .entry .stars { margin: 6px 0; font-size: 1.05rem; }
  .entry .date  { color: var(--muted); font-size: .85rem; }
  .entry .avis  { margin: 8px 0 0; color: #33382f; }
  .del {
    position: absolute; top: 14px; right: 14px; background: none; border: none;
    cursor: pointer; color: var(--line); font-size: 1.1rem; padding: 4px;
  }
  .del:hover { color: var(--film); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .big { font-size: 2.5rem; margin-bottom: 8px; }

  /* Bouton crayon (modifier) sur chaque entrée */
  .edit {
    position: absolute; top: 14px; right: 40px; background: none; border: none;
    cursor: pointer; color: var(--line); font-size: 1rem; padding: 4px;
  }
  .edit:hover { color: var(--accent); }

  /* Fenêtre de modification */
  .modal-bg {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(34,39,31,.45); padding: 40px 16px;
    align-items: flex-start; justify-content: center; overflow-y: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px; width: 100%; max-width: 420px; position: relative;
  }
  .modal h2 {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 1.3rem; margin: 0 32px 4px 0;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: none; border: none;
    font-size: 1.2rem; cursor: pointer; color: var(--muted);
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>Mon Carnet</h1>
    <p>Ce que j'ai vu, regardé et lu — noté et daté.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="layout">

    <div class="panel">
      <h2>Nouvelle entrée</h2>

      <label for="type">Type</label>
      <select id="type">
        <option value="film">Film</option>
        <option value="serie">Série</option>
        <option value="livre">Livre</option>
      </select>

      <label for="titre">Rechercher un titre</label>
      <div class="search-box">
        <input type="text" id="titre" placeholder="Commence à taper…" autocomplete="off">
        <div class="results" id="results"></div>
      </div>

      <div class="chosen" id="chosen">
        <img id="chosenImg" alt="">
        <div>
          <div class="c-title" id="chosenTitle"></div>
          <div class="c-sub" id="chosenSub"></div>
        </div>
        <button class="c-clear" id="chosenClear" title="Changer">✕</button>
      </div>

      <!-- Ce bloc n'apparaît que pour les séries (géré par majSaisonRow). -->
      <div id="saisonRow" style="display:none">
        <label for="saison">Saison (laisse vide pour toute la série)</label>
        <input type="text" id="saison" inputmode="numeric" placeholder="Ex : 2" autocomplete="off">
      </div>

      <label>Note</label>
      <div class="stars-input" id="starsInput"></div>

      <label for="avis">Avis (facultatif)</label>
      <textarea id="avis" placeholder="Ce que tu en as pensé…"></textarea>

      <label for="date">Terminé le</label>
      <input type="date" id="date">

      <button class="btn" id="ajouterBtn">Ajouter au carnet</button>
    </div>

    <div>
      <div class="tabs">
        <button class="tab active" id="tabJournal">Journal</button>
        <button class="tab" id="tabStats">Statistiques</button>
        <span class="tab-actions">
          <button class="tab-btn" id="importBtn" title="Restaurer une sauvegarde">⬆ Importer</button>
          <button class="tab-btn" id="exportBtn" title="Télécharger une sauvegarde">⬇ Exporter</button>
        </span>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      </div>

      <div id="vueJournal">
        <div class="controls">
          <input type="text" id="q" class="ctrl-search" placeholder="Rechercher dans mes entrées…" autocomplete="off">
          <select id="filtreType" class="ctrl">
            <option value="tous">Tous les types</option>
            <option value="film">Films</option>
            <option value="serie">Séries</option>
            <option value="livre">Livres</option>
          </select>
          <select id="tri" class="ctrl">
            <option value="date_desc">Terminé — récent</option>
            <option value="date_asc">Terminé — ancien</option>
            <option value="note_desc">Note — haute</option>
            <option value="note_asc">Note — basse</option>
            <option value="titre">Titre A→Z</option>
          </select>
        </div>
        <div id="journal"></div>
      </div>

      <div id="vueStats" style="display:none"></div>
    </div>

  </div>
</div>

<!-- Fenêtre de modification d'une entrée -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose" title="Fermer">✕</button>
    <h2 id="editTitre">Modifier</h2>

    <label>Note</label>
    <div class="stars-input" id="starsEdit"></div>

    <div id="saisonRowEdit" style="display:none">
      <label for="saisonEdit">Saison (laisse vide pour toute la série)</label>
      <input type="text" id="saisonEdit" inputmode="numeric" placeholder="Ex : 2" autocomplete="off">
    </div>

    <label for="avisEdit">Avis</label>
    <textarea id="avisEdit" placeholder="Ce que tu en as pensé…"></textarea>

    <label for="dateEdit">Terminé le</label>
    <input type="date" id="dateEdit">

    <button class="btn" id="enregistrerEdit">Enregistrer</button>
  </div>
</div>

<script>
/* =============================================================
   CONFIGURATION — les deux valeurs de connexion à ta base.
   L'URL est déjà remplie. Colle ta clé "publishable" entre les
   guillemets de SUPABASE_KEY (elle commence par sb_publishable_).
   Ces deux valeurs sont faites pour vivre dans le code du navigateur.
   ============================================================= */
const SUPABASE_URL = "https://pyswfjgptkdljstjtrtk.supabase.co";
const SUPABASE_KEY = "sb_publishable_v9VKqpjF771p5FnXFM-vtg_8u7uXGtJ";

// Ta clé TMDB (films & séries). Les livres n'en ont pas besoin.
const CLE_TMDB = "1e80173159e2ba2f1ec3e1436111397c";
/* ============================================================= */

// On crée le "client" Supabase : l'objet par lequel on parle à la base.
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let entrees = [];       // rempli depuis Supabase au démarrage
let noteChoisie = 0;
let selection = null;   // l'œuvre choisie dans les résultats de recherche

// État des contrôles du journal.
let filtreType = "tous";
let tri = "date_desc";
let recherche = "";

// État de la fenêtre de modification.
let editId = null;
let noteEdit = 0;

// Année affichée dans la rétrospective (null = année la plus récente).
let wrappedAnnee = null;

// Pourcentage de remplissage de l'étoile numéro i (1 à 5) pour une note donnée.
// Ex : note 2.5 -> étoiles 1 et 2 pleines (100 %), étoile 3 à moitié (50 %).
function fillPct(note, i) {
  const n = Number(note);
  if (n >= i) return 100;
  if (n >= i - 0.5) return 50;
  return 0;
}

// Étoiles en lecture seule, pour le journal (demi-étoiles comprises).
function etoilesHTML(note) {
  let html = '<span class="rating">';
  for (let i = 1; i <= 5; i++) {
    html += '<span class="st"><span class="fill" style="width:' + fillPct(note, i) + '%"></span></span>';
  }
  return html + '</span>';
}

// Met à jour le remplissage des étoiles d'un conteneur donné.
function renderStars(containerId, v) {
  document.querySelectorAll("#" + containerId + " .st").forEach((st, idx) => {
    st.querySelector(".fill").style.width = fillPct(v, idx + 1) + "%";
  });
}

/* ---------- Étoiles cliquables réutilisables (demi-étoiles) ----------
   getVal renvoie la note courante, setVal l'enregistre. On s'en sert
   pour le formulaire d'ajout ET pour la fenêtre de modification. */
function construireEtoiles(containerId, getVal, setVal) {
  const zone = document.getElementById(containerId);
  zone.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const st = document.createElement("span");
    st.className = "st";
    st.innerHTML = '<span class="fill"></span>';
    // Chaque étoile a deux demi-zones cliquables : gauche = i-0.5, droite = i.
    const gauche = document.createElement("span"); gauche.className = "half left";
    const droite = document.createElement("span"); droite.className = "half right";
    gauche.addEventListener("click", () => { setVal(i - 0.5); renderStars(containerId, getVal()); });
    droite.addEventListener("click", () => { setVal(i);       renderStars(containerId, getVal()); });
    gauche.addEventListener("mouseenter", () => renderStars(containerId, i - 0.5));
    droite.addEventListener("mouseenter", () => renderStars(containerId, i));
    st.append(gauche, droite);
    zone.appendChild(st);
  }
  zone.onmouseleave = () => renderStars(containerId, getVal());
  renderStars(containerId, getVal());
}

// Étoiles du formulaire d'ajout (branchées sur noteChoisie).
function construireEtoilesFormulaire() {
  construireEtoiles("starsInput", () => noteChoisie, v => { noteChoisie = v; });
}

/* =============================================================
   BASE DE DONNÉES (Supabase)
   Chaque opération est un appel réseau : d'où async/await.
   ============================================================= */

// Charge toutes les entrées depuis la table "entrees".
async function charger() {
  const journal = document.getElementById("journal");

  // Garde-fou : tant que la clé n'est pas collée, on explique quoi faire.
  if (SUPABASE_KEY.startsWith("COLLE")) {
    journal.innerHTML = '<div class="empty"><div class="big">🔑</div>'
      + '<p>Colle ta clé publishable Supabase dans le code<br>'
      + '(ligne <code>SUPABASE_KEY</code>) pour connecter la base.</p></div>';
    return;
  }

  const { data, error } = await db
    .from("entrees")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    journal.innerHTML = '<div class="empty"><p>Impossible de charger : '
      + echapper(error.message) + '</p></div>';
    return;
  }
  entrees = data || [];
  afficher();
}

// Ajoute une entrée dans la base, puis recharge la liste.
async function ajouter() {
  const type = document.getElementById("type").value;
  const avis = document.getElementById("avis").value.trim();
  const date = document.getElementById("date").value;
  const saisonVal = document.getElementById("saison").value.trim();

  if (!selection) { alert("Choisis une œuvre dans les résultats de recherche."); return; }
  if (noteChoisie === 0) { alert("Choisis une note."); return; }

  const bouton = document.getElementById("ajouterBtn");
  bouton.disabled = true;                       // évite le double-clic pendant l'envoi

  const { error } = await db.from("entrees").insert({
    titre:    selection.titre,
    type:     type,
    note:     noteChoisie,
    avis:     avis,
    date_fin: date || null,
    poster:   selection.poster || "",
    annee:    selection.annee || "",
    // La saison n'a de sens que pour une série ; sinon on met null.
    saison:   (type === "serie" && saisonVal) ? Number(saisonVal) : null
  });

  bouton.disabled = false;
  if (error) { alert("Erreur à l'enregistrement : " + error.message); return; }

  reinitialiserFormulaire();
  await charger();
}

// Supprime une entrée d'après son id, puis recharge.
async function supprimer(id) {
  const { error } = await db.from("entrees").delete().eq("id", id);
  if (error) { alert("Erreur à la suppression : " + error.message); return; }
  await charger();
}

/* ---------- Modification d'une entrée ---------- */

// Ouvre la fenêtre pré-remplie avec les valeurs de l'entrée choisie.
function ouvrirEdition(id) {
  const e = entrees.find(x => x.id === id);
  if (!e) return;
  editId = id;
  noteEdit = Number(e.note);
  document.getElementById("editTitre").textContent = e.titre;
  construireEtoiles("starsEdit", () => noteEdit, v => { noteEdit = v; });
  document.getElementById("avisEdit").value = e.avis || "";
  document.getElementById("dateEdit").value = e.date_fin || "";

  const rowS = document.getElementById("saisonRowEdit");
  if (e.type === "serie") {
    rowS.style.display = "block";
    document.getElementById("saisonEdit").value = e.saison || "";
  } else {
    rowS.style.display = "none";
    document.getElementById("saisonEdit").value = "";
  }
  document.getElementById("modalBg").classList.add("open");
}

function fermerEdition() {
  document.getElementById("modalBg").classList.remove("open");
  editId = null;
}

// Enregistre les changements dans Supabase (update), puis recharge.
async function enregistrerEdition() {
  if (editId == null) return;
  if (noteEdit === 0) { alert("Choisis une note."); return; }

  const e = entrees.find(x => x.id === editId);
  const type = e ? e.type : null;
  const avis = document.getElementById("avisEdit").value.trim();
  const date = document.getElementById("dateEdit").value;
  const saisonVal = document.getElementById("saisonEdit").value.trim();

  const btn = document.getElementById("enregistrerEdit");
  btn.disabled = true;
  const { error } = await db.from("entrees").update({
    note:     noteEdit,
    avis:     avis,
    date_fin: date || null,
    saison:   (type === "serie" && saisonVal) ? Number(saisonVal) : null
  }).eq("id", editId);
  btn.disabled = false;

  if (error) { alert("Erreur à la modification : " + error.message); return; }
  fermerEdition();
  await charger();
}

function reinitialiserFormulaire() {
  document.getElementById("avis").value = "";
  document.getElementById("date").value = "";
  document.getElementById("saison").value = "";
  document.getElementById("type").value = "film";
  noteChoisie = 0;
  majSaisonRow();          // le type repasse à "film" → on masque la saison
  effacerSelection();
  construireEtoilesFormulaire();
}

// Affiche le champ Saison uniquement quand le type est "série".
function majSaisonRow() {
  const estSerie = document.getElementById("type").value === "serie";
  document.getElementById("saisonRow").style.display = estSerie ? "block" : "none";
  if (!estSerie) document.getElementById("saison").value = "";
}

/* =============================================================
   RECHERCHE DE TITRES (TMDB + Open Library)
   ============================================================= */

async function chercherTMDB(query, kind) {
  const url = "https://api.themoviedb.org/3/search/" + kind
            + "?api_key=" + CLE_TMDB
            + "&language=fr-FR&query=" + encodeURIComponent(query);
  const rep = await fetch(url);
  if (!rep.ok) throw new Error("TMDB a répondu " + rep.status);
  const data = await rep.json();
  return (data.results || []).slice(0, 6).map(r => ({
    titre:  r.title || r.name,
    annee:  (r.release_date || r.first_air_date || "").slice(0, 4),
    poster: r.poster_path ? "https://image.tmdb.org/t/p/w154" + r.poster_path : "",
    sous:   ""
  }));
}

async function chercherOpenLibrary(query) {
  const url = "https://openlibrary.org/search.json?limit=6"
            + "&fields=title,author_name,first_publish_year,cover_i&title="
            + encodeURIComponent(query);
  const rep = await fetch(url);
  if (!rep.ok) throw new Error("Open Library a répondu " + rep.status);
  const data = await rep.json();
  return (data.docs || []).slice(0, 6).map(d => ({
    titre:  d.title,
    annee:  d.first_publish_year ? String(d.first_publish_year) : "",
    poster: d.cover_i ? "https://covers.openlibrary.org/b/id/" + d.cover_i + "-M.jpg" : "",
    sous:   d.author_name ? d.author_name[0] : ""
  }));
}

async function rechercher() {
  const query = document.getElementById("titre").value.trim();
  const type  = document.getElementById("type").value;
  const zone  = document.getElementById("results");

  if (query.length < 2) { zone.innerHTML = ""; return; }

  if ((type === "film" || type === "serie") && CLE_TMDB === "") {
    zone.innerHTML = '<div class="hint">Ajoute ta clé TMDB dans le code pour '
                   + 'chercher films et séries. Les livres marchent déjà.</div>';
    return;
  }

  zone.innerHTML = '<div class="hint">Recherche…</div>';
  try {
    let liste;
    if (type === "film")  liste = await chercherTMDB(query, "movie");
    else if (type === "serie") liste = await chercherTMDB(query, "tv");
    else liste = await chercherOpenLibrary(query);
    afficherResultats(liste);
  } catch (err) {
    zone.innerHTML = '<div class="hint">Souci : ' + echapper(err.message) + '</div>';
  }
}

function afficherResultats(liste) {
  const zone = document.getElementById("results");
  if (liste.length === 0) { zone.innerHTML = '<div class="hint">Aucun résultat.</div>'; return; }
  zone.innerHTML = "";
  for (const item of liste) {
    const div = document.createElement("div");
    div.className = "result";
    const sousTexte = [item.annee, item.sous].filter(Boolean).join(" · ");
    div.innerHTML =
      (item.poster ? '<img src="' + item.poster + '" alt="">' : '<img alt="">')
      + '<div><div class="r-title">' + echapper(item.titre) + '</div>'
      + '<div class="r-sub">' + echapper(sousTexte) + '</div></div>';
    div.addEventListener("click", () => choisir(item));
    zone.appendChild(div);
  }
}

function choisir(item) {
  selection = item;
  document.getElementById("titre").value = item.titre;
  document.getElementById("results").innerHTML = "";
  const chip = document.getElementById("chosen");
  chip.style.display = "flex";
  document.getElementById("chosenImg").src = item.poster || "";
  document.getElementById("chosenTitle").textContent = item.titre;
  document.getElementById("chosenSub").textContent =
    [item.annee, item.sous].filter(Boolean).join(" · ");
}

function effacerSelection() {
  selection = null;
  document.getElementById("chosen").style.display = "none";
  document.getElementById("titre").value = "";
  document.getElementById("results").innerHTML = "";
}

function moisLisible(dateStr) {
  if (!dateStr) return "Sans date";
  return new Date(dateStr).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
}

function afficher() {
  afficherStats();
  afficherJournal();
  // Si la vue Statistiques est ouverte, on la recalcule aussi.
  const vs = document.getElementById("vueStats");
  if (vs && vs.style.display === "block") afficherStatsPage();
}

function afficherStats() {
  const zone = document.getElementById("stats");
  const total = entrees.length;
  const nb = t => entrees.filter(e => e.type === t).length;
  const f = nb("film"), s = nb("serie"), l = nb("livre");

  // Barre de répartition : une portion colorée par type, proportionnelle.
  const pct = n => total ? (n / total * 100) : 0;
  const dist = total === 0 ? "" :
      '<div class="dist">'
    + (f ? '<span style="width:' + pct(f) + '%;background:var(--film)"></span>'  : '')
    + (s ? '<span style="width:' + pct(s) + '%;background:var(--serie)"></span>' : '')
    + (l ? '<span style="width:' + pct(l) + '%;background:var(--livre)"></span>' : '')
    + '</div>';

  zone.innerHTML =
      '<div class="stats-hero"><div class="num-big">' + total + '</div>'
    + '<div class="lbl">entrées</div></div>'
    + '<div class="stats-sep"></div>'
    + '<div class="stats-types"><div class="type-row">'
    +   '<span class="type-stat"><span class="dot film"></span><b>'  + f + '</b> films</span>'
    +   '<span class="type-stat"><span class="dot serie"></span><b>' + s + '</b> séries</span>'
    +   '<span class="type-stat"><span class="dot livre"></span><b>' + l + '</b> livres</span>'
    + '</div>' + dist + '</div>';
}

// Renvoie une fonction de comparaison selon le tri choisi.
function comparateur(mode) {
  const parDate = (a, b, sens) => {
    if (!a.date_fin) return 1;          // les sans-date toujours en dernier
    if (!b.date_fin) return -1;
    return sens * a.date_fin.localeCompare(b.date_fin);
  };
  if (mode === "date_desc") return (a, b) => parDate(a, b, -1);
  if (mode === "date_asc")  return (a, b) => parDate(a, b, 1);
  if (mode === "note_desc") return (a, b) => Number(b.note) - Number(a.note);
  if (mode === "note_asc")  return (a, b) => Number(a.note) - Number(b.note);
  if (mode === "titre")     return (a, b) => (a.titre || "").localeCompare(b.titre || "", "fr");
  return () => 0;
}

function afficherJournal() {
  const zone = document.getElementById("journal");

  if (entrees.length === 0) {
    zone.innerHTML = '<div class="empty"><div class="big">✷</div>'
      + '<p>Ton carnet est vide.<br>Cherche ta première œuvre à gauche.</p></div>';
    return;
  }

  // 1) On part de toutes les entrées, puis on filtre et on trie.
  let liste = entrees.slice();
  if (filtreType !== "tous") liste = liste.filter(e => e.type === filtreType);
  if (recherche) {
    const r = recherche.toLowerCase();
    liste = liste.filter(e => (e.titre || "").toLowerCase().includes(r));
  }
  liste.sort(comparateur(tri));

  // Aucun résultat pour les filtres en cours (mais le carnet n'est pas vide).
  if (liste.length === 0) {
    zone.innerHTML = '<div class="empty"><div class="big">∅</div>'
      + '<p>Aucune entrée ne correspond à ces filtres.</p></div>';
    return;
  }

  // 2) On regroupe par mois uniquement quand on trie par date.
  const grouperParMois = (tri === "date_desc" || tri === "date_asc");

  let html = "";
  let moisCourant = "";
  for (const e of liste) {
    if (grouperParMois) {
      const mois = moisLisible(e.date_fin);
      if (mois !== moisCourant) { html += '<div class="month-sep">' + mois + '</div>'; moisCourant = mois; }
    }
    const dateAffichee = e.date_fin ? new Date(e.date_fin).toLocaleDateString("fr-FR") : "—";
    html +=
      '<div class="entry ' + e.type + '">'
    + (e.poster
        ? '<img class="poster" src="' + e.poster + '" alt="">'
        : '<div class="poster ph ph-' + e.type + '">'
          + echapper((e.titre || "?").charAt(0).toUpperCase()) + '</div>')
    + '<div class="entry-body">'
    + '<button class="del" onclick="supprimer(' + e.id + ')" title="Supprimer">✕</button>'
    + '<button class="edit" onclick="ouvrirEdition(' + e.id + ')" title="Modifier">✎</button>'
    + '<div class="entry-top"><h3>' + echapper(e.titre) + '</h3>'
    + '<span class="tag ' + e.type + '">' + e.type + '</span>'
    + ((e.type === "serie" && e.saison) ? '<span class="saison">Saison ' + e.saison + '</span>' : '')
    + '</div>'
    + '<div class="stars">' + etoilesHTML(e.note) + '</div>'
    + '<div class="date">Terminé le ' + dateAffichee + '</div>'
    + (e.avis ? '<p class="avis">' + echapper(e.avis) + '</p>' : '')
    + '</div></div>';
  }
  zone.innerHTML = html;
}

function echapper(txt) {
  const d = document.createElement("div");
  d.textContent = txt == null ? "" : txt;
  return d.innerHTML;
}

/* =============================================================
   STATISTIQUES, EXPORT ET BASCULE DE VUE
   ============================================================= */

// Une ligne de mini-graphique : libellé, barre proportionnelle, valeur.
function barRow(label, val, max) {
  const pct = max ? (val / max * 100) : 0;
  return '<div class="bar-row"><span class="bar-label">' + echapper(label) + '</span>'
    + '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>'
    + '<span class="bar-val">' + val + '</span></div>';
}

// Construit la page de statistiques à partir de toutes les entrées.
function afficherStatsPage() {
  const zone = document.getElementById("vueStats");
  const n = entrees.length;
  if (n === 0) {
    zone.innerHTML = '<div class="empty"><p>Pas encore de données à analyser.</p></div>';
    return;
  }

  const moyenne = (entrees.reduce((s, e) => s + Number(e.note), 0) / n).toFixed(2);

  // Répartition des notes (de 5 à 0,5).
  const valeurs = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5];
  const compteNote = {}; valeurs.forEach(v => compteNote[v] = 0);
  entrees.forEach(e => { const v = Number(e.note); if (compteNote[v] !== undefined) compteNote[v]++; });
  const maxNote = Math.max(1, ...valeurs.map(v => compteNote[v]));
  const distNotes = valeurs
    .map(v => barRow(String(v).replace(".", ",") + " ★", compteNote[v], maxNote))
    .join("");

  // Œuvres par année (d'après la date de fin).
  const parAnnee = {};
  entrees.forEach(e => { if (e.date_fin) { const y = e.date_fin.slice(0, 4); parAnnee[y] = (parAnnee[y] || 0) + 1; } });
  const annees = Object.keys(parAnnee).sort();
  const maxAnnee = Math.max(1, ...annees.map(y => parAnnee[y]));
  const distAnnees = annees.length
    ? annees.map(y => barRow(y, parAnnee[y], maxAnnee)).join("")
    : '<p class="muted-note">Aucune date renseignée pour l\'instant.</p>';

  // Mois le plus actif.
  const parMois = {};
  entrees.forEach(e => { if (e.date_fin) { const m = e.date_fin.slice(0, 7); parMois[m] = (parMois[m] || 0) + 1; } });
  const moisKeys = Object.keys(parMois);
  let moisTop = "—";
  if (moisKeys.length) {
    const best = moisKeys.reduce((a, b) => (parMois[b] > parMois[a] ? b : a));
    moisTop = moisLisible(best + "-01") + " — " + parMois[best] + " entrée" + (parMois[best] > 1 ? "s" : "");
  }

  // Mieux notées (top 5).
  const top = [...entrees].sort((a, b) => Number(b.note) - Number(a.note)).slice(0, 5);
  const topHtml = top.map(e =>
    '<div class="top-item">' + etoilesHTML(e.note)
    + '<span>' + echapper(e.titre)
    + ((e.type === "serie" && e.saison) ? " · S" + e.saison : "") + '</span></div>'
  ).join("");

  zone.innerHTML =
      '<div class="stats-page">'
    + wrappedHTML()
    + '<div class="stat-card"><h3>Vue d\'ensemble</h3>'
    +   '<div class="big-stat">' + moyenne.replace(".", ",") + '</div>'
    +   '<div class="muted-note">note moyenne sur ' + n + ' entrées</div>'
    +   '<div class="muted-note" style="margin-top:8px">Mois le plus actif : ' + moisTop + '</div>'
    + '</div>'
    + '<div class="stat-card"><h3>Répartition des notes</h3>' + distNotes + '</div>'
    + heatmapHTML()
    + '<div class="stat-card"><h3>Œuvres par année</h3>' + distAnnees + '</div>'
    + '<div class="stat-card"><h3>Mieux notées</h3><div class="top-list">' + topHtml + '</div></div>'
    + '</div>';
}

// Renvoie 'YYYY-MM-DD' pour une date locale (sans souci de fuseau horaire).
function ymd(d) {
  return d.getFullYear() + "-"
    + String(d.getMonth() + 1).padStart(2, "0") + "-"
    + String(d.getDate()).padStart(2, "0");
}

// Niveau de couleur (0 à 4) selon le nombre d'entrées un jour donné.
function niveauJour(c) {
  if (c <= 0) return 0;
  if (c === 1) return 1;
  if (c === 2) return 2;
  if (c === 3) return 3;
  return 4;
}

// Construit le calendrier d'activité (façon "contributions GitHub") sur ~1 an.
function heatmapHTML() {
  // Nombre d'entrées terminées par jour.
  const parJour = {};
  entrees.forEach(e => { if (e.date_fin) parJour[e.date_fin] = (parJour[e.date_fin] || 0) + 1; });

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const jourSem = (today.getDay() + 6) % 7;              // 0 = lundi … 6 = dimanche
  const debut = new Date(today);
  debut.setDate(debut.getDate() - (52 * 7) - jourSem);   // ~53 colonnes, commence un lundi

  const moisNoms = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
                    "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const cols = [];
  const cur = new Date(debut);
  let moisPrec = -1;
  while (cur <= today) {
    const col = { label: "", cells: [] };
    if (cur.getMonth() !== moisPrec) { col.label = moisNoms[cur.getMonth()]; moisPrec = cur.getMonth(); }
    for (let d = 0; d < 7; d++) {
      const iso = ymd(cur);
      col.cells.push({ iso, c: (cur <= today) ? (parJour[iso] || 0) : -1 });
      cur.setDate(cur.getDate() + 1);
    }
    cols.push(col);
  }

  const labels = '<div class="hm-labels">'
    + cols.map(col => '<span class="hm-lab">' + col.label + '</span>').join("") + '</div>';
  const grid = '<div class="hm-grid">'
    + cols.map(col => '<div class="hm-col">'
        + col.cells.map(cell => cell.c < 0
            ? '<span class="hm-cell hm-empty"></span>'
            : '<span class="hm-cell hm-' + niveauJour(cell.c) + '" title="'
              + cell.iso + ' — ' + cell.c + ' entrée' + (cell.c > 1 ? "s" : "") + '"></span>'
          ).join("") + '</div>').join("") + '</div>';
  const legende = '<div class="hm-legend">Moins '
    + [0, 1, 2, 3, 4].map(l => '<span class="hm-cell hm-' + l + '"></span>').join("")
    + ' Plus</div>';

  return '<div class="stat-card"><h3>Calendrier d\'activité</h3>'
    + '<div class="hm-scroll">' + labels + grid + '</div>' + legende + '</div>';
}

// Calcule les chiffres d'une année (chaîne "AAAA") à partir des entrées.
function statsAnnee(annee) {
  const list = entrees.filter(e => e.date_fin && e.date_fin.slice(0, 4) === annee);
  const n = list.length;
  const nb = t => list.filter(e => e.type === t).length;
  const moy = n ? list.reduce((s, e) => s + Number(e.note), 0) / n : 0;
  const top = n ? [...list].sort((a, b) => Number(b.note) - Number(a.note))[0] : null;
  const cinq = list.filter(e => Number(e.note) === 5).length;
  const parMois = {};
  list.forEach(e => { const m = e.date_fin.slice(0, 7); parMois[m] = (parMois[m] || 0) + 1; });
  let moisTop = null, moisMax = 0;
  Object.keys(parMois).forEach(m => { if (parMois[m] > moisMax) { moisMax = parMois[m]; moisTop = m; } });
  return { n, films: nb("film"), series: nb("serie"), livres: nb("livre"), moy, top, cinq, moisTop, moisMax };
}

// Change l'année de la rétrospective et recalcule la page.
function changerAnneeWrapped(a) { wrappedAnnee = a; afficherStatsPage(); }

// Construit la carte "Wrapped" de l'année sélectionnée.
function wrappedHTML() {
  const annees = [...new Set(entrees.filter(e => e.date_fin).map(e => e.date_fin.slice(0, 4)))].sort().reverse();
  if (annees.length === 0) return "";                         // aucune date → pas de rétrospective
  if (!wrappedAnnee || !annees.includes(wrappedAnnee)) wrappedAnnee = annees[0];

  const select = '<select class="wrapped-year" onchange="changerAnneeWrapped(this.value)">'
    + annees.map(a => '<option value="' + a + '"' + (a === wrappedAnnee ? " selected" : "") + '>' + a + '</option>').join("")
    + '</select>';
  const head = '<div class="wrapped-head"><h3>Rétrospective</h3>' + select + '</div>';

  const s = statsAnnee(wrappedAnnee);
  if (s.n === 0) {
    return '<div class="wrapped">' + head
      + '<p class="wrapped-empty">Rien de terminé en ' + wrappedAnnee + '.</p></div>';
  }

  const mois = s.moisTop ? moisLisible(s.moisTop + "-01") + " (" + s.moisMax + ")" : "—";
  const coup = s.top
    ? '<div class="wrapped-coup-wrap"><div class="w-lab">Ton coup de cœur</div>'
      + '<div class="wrapped-coup">' + etoilesHTML(s.top.note)
      + '<span>' + echapper(s.top.titre)
      + ((s.top.type === "serie" && s.top.saison) ? " · S" + s.top.saison : "") + '</span></div></div>'
    : "";

  return '<div class="wrapped">' + head
    + '<div class="wrapped-big">' + s.n + '</div>'
    + '<div class="wrapped-sub">œuvres terminées en ' + wrappedAnnee + '</div>'
    + '<div class="wrapped-row">'
    +   '<span><b>' + s.films  + '</b> films</span>'
    +   '<span><b>' + s.series + '</b> séries</span>'
    +   '<span><b>' + s.livres + '</b> livres</span>'
    + '</div>'
    + '<div class="wrapped-grid">'
    +   '<div><div class="w-num">' + s.moy.toFixed(2).replace(".", ",") + '</div><div class="w-lab">note moyenne</div></div>'
    +   '<div><div class="w-num">' + s.cinq + '</div><div class="w-lab">coups de 5★</div></div>'
    +   '<div><div class="w-num" style="font-size:1.05rem">' + mois + '</div><div class="w-lab">mois le plus actif</div></div>'
    + '</div>'
    + coup + '</div>';
}

// Bascule entre la vue Journal et la vue Statistiques.
function montrerVue(nom) {
  const estStats = (nom === "stats");
  document.getElementById("vueJournal").style.display = estStats ? "none" : "block";
  document.getElementById("vueStats").style.display   = estStats ? "block" : "none";
  document.getElementById("tabJournal").classList.toggle("active", !estStats);
  document.getElementById("tabStats").classList.toggle("active", estStats);
  if (estStats) afficherStatsPage();
}

// Télécharge tout le carnet en fichier JSON (sauvegarde).
function exporter() {
  const contenu = JSON.stringify(entrees, null, 2);
  const blob = new Blob([contenu], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mon-carnet-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

// Ouvre le sélecteur de fichier.
function declencherImport() { document.getElementById("importFile").click(); }

// Lit le fichier choisi, le valide, puis lance l'import.
function lireImport(ev) {
  const fichier = ev.target.files[0];
  if (!fichier) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch { alert("Fichier illisible : ce n'est pas un JSON valide."); ev.target.value = ""; return; }
    if (!Array.isArray(data)) {
      alert("Format inattendu : le fichier doit contenir une liste d'entrées.");
      ev.target.value = ""; return;
    }
    await importer(data);
    ev.target.value = "";   // permet de re-sélectionner le même fichier plus tard
  };
  reader.readAsText(fichier);
}

// Réinjecte les entrées dans Supabase, en ignorant les doublons.
async function importer(data) {
  // Clé anti-doublon : même titre, type, saison et date de fin.
  const cle = e => [e.titre, e.type, e.saison || "", e.date_fin || ""].join("|");
  const dejaLa = new Set(entrees.map(cle));

  const aInserer = [];
  let ignores = 0;
  for (const e of data) {
    if (!e || !e.titre || !e.type || e.note == null) { ignores++; continue; }
    if (dejaLa.has(cle(e))) { ignores++; continue; }
    dejaLa.add(cle(e));                       // évite aussi les doublons internes au fichier
    aInserer.push({
      titre:    e.titre,
      type:     e.type,
      note:     Number(e.note),
      avis:     e.avis || "",
      date_fin: e.date_fin || null,
      poster:   e.poster || "",
      annee:    e.annee || "",
      saison:   (e.type === "serie" && e.saison) ? Number(e.saison) : null
    });
  }

  if (aInserer.length === 0) {
    alert("Rien à importer (" + ignores + " entrée(s) déjà présente(s) ou invalide(s)).");
    return;
  }
  const { error } = await db.from("entrees").insert(aInserer);
  if (error) { alert("Erreur à l'import : " + error.message); return; }
  await charger();
  alert(aInserer.length + " entrée(s) importée(s)"
    + (ignores ? ", " + ignores + " ignorée(s) (doublon ou invalide)." : "."));
}
